<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Comparison Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col">
    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- CHANGE YOUR PASSWORD HERE ---
        const SECRET_PASSWORD = "research2026"; 

        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [passwordInput, setPasswordInput] = useState("");
            const [loginError, setLoginError] = useState(false);

            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [selectedRow, setSelectedRow] = useState(null);
            
            // 4 Filters State
            const [filterModel, setFilterModel] = useState("All");
            const [filterDataset, setFilterDataset] = useState("All");
            const [filterMode, setFilterMode] = useState("All");
            const [filterMethod, setFilterMethod] = useState("All");
            
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });

            const handleLogin = (e) => {
                e.preventDefault();
                if (passwordInput === SECRET_PASSWORD) {
                    setIsAuthenticated(true);
                } else {
                    setLoginError(true);
                    setPasswordInput("");
                }
            };

            useEffect(() => {
                if (!isAuthenticated) return;

                fetch('results.json')
                    .then(res => {
                        if (!res.ok) throw new Error("Could not load results.json");
                        return res.json();
                    })
                    .then(jsonData => {
                        const parsedRows = [];
                        for (const [model, datasets] of Object.entries(jsonData)) {
                            for (const [dataset, modes] of Object.entries(datasets)) {
                                for (const [mode, methods] of Object.entries(modes)) {
                                    const modeStr = mode === "_abstaintion" ? "Abstention" : "No Abstention";
                                    for (const [method, details] of Object.entries(methods)) {
                                        if (Object.keys(details).length === 0) continue;
                                        parsedRows.push({
                                            id: `${model}-${dataset}-${modeStr}-${method}`,
                                            model: model.replace('result_', ''),
                                            dataset, 
                                            mode: modeStr, 
                                            method: method.replace('_', ''),
                                            ...details
                                        });
                                    }
                                }
                            }
                        }
                        setData(parsedRows);
                        setLoading(false);
                    })
                    .catch(err => {
                        setError(err.message);
                        setLoading(false);
                    });
            }, [isAuthenticated]);

            if (!isAuthenticated) {
                return (
                    <div className="flex-1 flex items-center justify-center bg-gray-100">
                        <div className="bg-white p-8 rounded-lg shadow-md w-full max-w-sm border border-gray-200">
                            <h2 className="text-2xl font-bold text-center mb-6 text-gray-800">Dashboard Access</h2>
                            <form onSubmit={handleLogin} className="flex flex-col gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <input 
                                        type="password" 
                                        value={passwordInput}
                                        onChange={(e) => { setPasswordInput(e.target.value); setLoginError(false); }}
                                        className="w-full px-4 py-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500"
                                        placeholder="Enter password"
                                        autoFocus
                                    />
                                </div>
                                {loginError && <p className="text-red-500 text-sm">Incorrect password.</p>}
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">
                                    Login
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // Extract unique values for all 4 dropdowns
            const uniqueModels = useMemo(() => [...new Set(data.map(d => d.model))], [data]);
            const uniqueDatasets = useMemo(() => [...new Set(data.map(d => d.dataset))], [data]);
            const uniqueModes = useMemo(() => [...new Set(data.map(d => d.mode))], [data]);
            const uniqueMethods = useMemo(() => [...new Set(data.map(d => d.method))], [data]);

            // Apply all 4 filters
            const filteredData = useMemo(() => {
                return data.filter(row => {
                    return (filterModel === "All" || row.model === filterModel) &&
                           (filterDataset === "All" || row.dataset === filterDataset) &&
                           (filterMode === "All" || row.mode === filterMode) &&
                           (filterMethod === "All" || row.method === filterMethod);
                });
            }, [data, filterModel, filterDataset, filterMode, filterMethod]);

            // Sorting logic
            const sortedData = useMemo(() => {
                let sortableItems = [...filteredData];
                if (sortConfig.key !== null) {
                    sortableItems.sort((a, b) => {
                        let aVal, bVal;
                        switch (sortConfig.key) {
                            case 'overall_accuracy':
                                aVal = a.metrics?.overall_accuracy ?? -1; bVal = b.metrics?.overall_accuracy ?? -1; break;
                            case 'ans_recall':
                                aVal = a.metrics?.answerable?.sample_recall ?? -1; bVal = b.metrics?.answerable?.sample_recall ?? -1; break;
                            case 'unans_recall':
                                aVal = a.metrics?.unanswerable?.sample_recall ?? -1; bVal = b.metrics?.unanswerable?.sample_recall ?? -1; break;
                            default:
                                aVal = a[sortConfig.key]?.toString().toLowerCase() || ""; bVal = b[sortConfig.key]?.toString().toLowerCase() || "";
                        }
                        if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return sortableItems;
            }, [filteredData, sortConfig]);

            const requestSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const getSortIndicator = (key) => sortConfig.key === key ? (sortConfig.direction === 'asc' ? ' ▲' : ' ▼') : ' ↕';
            const formatNum = (num) => (num !== null && num !== undefined) ? Number(num).toFixed(4) : '-';

            if (loading) return <div className="text-center mt-20 font-bold">Loading Model Data...</div>;
            if (error) return <div className="text-center mt-20 text-red-600 font-bold">Error: {error}</div>;

            return (
                <div className="max-w-7xl mx-auto p-6 flex-1 w-full">
                    <div className="flex justify-between items-end mb-6">
                        <div>
                            <h1 className="text-3xl font-bold mb-2">Model Comparison Dashboard</h1>
                            <p className="text-gray-500">Compare performance metrics across different models and datasets.</p>
                        </div>
                        <button onClick={() => setIsAuthenticated(false)} className="text-sm text-gray-500 hover:text-red-600 underline">Logout</button>
                    </div>
                    
                    {/* Filter Controls - Now a 4-column Grid */}
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6 p-4 bg-white rounded-lg shadow border border-gray-200">
                        <div>
                            <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Model</label>
                            <select value={filterModel} onChange={(e) => setFilterModel(e.target.value)} className="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded p-2">
                                <option value="All">All Models</option>
                                {uniqueModels.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Dataset</label>
                            <select value={filterDataset} onChange={(e) => setFilterDataset(e.target.value)} className="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded p-2">
                                <option value="All">All Datasets</option>
                                {uniqueDatasets.map(d => <option key={d} value={d}>{d}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Mode</label>
                            <select value={filterMode} onChange={(e) => setFilterMode(e.target.value)} className="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded p-2">
                                <option value="All">All Modes</option>
                                {uniqueModes.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Method</label>
                            <select value={filterMethod} onChange={(e) => setFilterMethod(e.target.value)} className="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded p-2">
                                <option value="All">All Methods</option>
                                {uniqueMethods.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                        </div>
                    </div>

                    <div className="bg-white shadow-md rounded-lg overflow-x-auto border border-gray-200">
                        <table className="min-w-full text-sm text-left whitespace-nowrap select-none">
                            <thead className="bg-gray-800 text-white uppercase tracking-wide">
                                <tr>
                                    <th className="px-4 py-3 cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('model')}>
                                        Model <span className="text-gray-400 text-xs">{getSortIndicator('model')}</span>
                                    </th>
                                    <th className="px-4 py-3 border-l border-gray-700 cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('dataset')}>
                                        Dataset <span className="text-gray-400 text-xs">{getSortIndicator('dataset')}</span>
                                    </th>
                                    <th className="px-4 py-3 cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('mode')}>
                                        Mode <span className="text-gray-400 text-xs">{getSortIndicator('mode')}</span>
                                    </th>
                                    <th className="px-4 py-3 cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('method')}>
                                        Method <span className="text-gray-400 text-xs">{getSortIndicator('method')}</span>
                                    </th>
                                    <th className="px-4 py-3 text-right bg-gray-900 cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('overall_accuracy')}>
                                        Overall Acc <span className="text-gray-400 text-xs">{getSortIndicator('overall_accuracy')}</span>
                                    </th>
                                    <th className="px-4 py-3 text-right border-l border-gray-700 cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('ans_recall')}>
                                        Ans Recall <span className="text-gray-400 text-xs">{getSortIndicator('ans_recall')}</span>
                                    </th>
                                    <th className="px-4 py-3 text-right cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('unans_recall')}>
                                        Unans Recall <span className="text-gray-400 text-xs">{getSortIndicator('unans_recall')}</span>
                                    </th>
                                    <th className="px-4 py-3 text-center border-l border-gray-700">JSON Data</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-200">
                                {sortedData.map((row, index) => (
                                    <tr key={row.id} className={`hover:bg-blue-50 transition-colors ${index % 2 === 0 ? "bg-white" : "bg-gray-50"}`}>
                                        <td className="px-4 py-3 font-bold text-blue-900">{row.model}</td>
                                        <td className="px-4 py-3 font-semibold border-l border-gray-200">{row.dataset}</td>
                                        <td className="px-4 py-3">
                                            <span className={`px-2 py-1 rounded text-xs font-semibold ${row.mode === 'Abstention' ? 'bg-purple-100 text-purple-800' : 'bg-gray-200 text-gray-800'}`}>
                                                {row.mode}
                                            </span>
                                        </td>
                                        <td className="px-4 py-3 text-gray-600">{row.method}</td>
                                        <td className="px-4 py-3 text-right font-bold text-gray-900 bg-gray-50">{formatNum(row.metrics?.overall_accuracy)}</td>
                                        <td className="px-4 py-3 text-right border-l border-gray-200">{formatNum(row.metrics?.answerable?.sample_recall)}</td>
                                        <td className="px-4 py-3 text-right">{formatNum(row.metrics?.unanswerable?.sample_recall)}</td>
                                        <td className="px-4 py-3 text-center border-l border-gray-200">
                                            <button onClick={() => setSelectedRow(row)} className="bg-gray-800 hover:bg-black text-white px-3 py-1.5 rounded text-xs font-medium transition shadow-sm">
                                                Inspect Values
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                                {sortedData.length === 0 && <tr><td colSpan="8" className="px-4 py-8 text-center text-gray-500 font-medium">No data matches the selected filters.</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    {selectedRow && (
                        <div className="fixed inset-0 bg-gray-900 bg-opacity-75 flex justify-center items-center p-4 z-50 backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col relative">
                                <div className="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                                    <h2 className="text-xl font-bold text-gray-800">
                                        <span className="text-blue-600">{selectedRow.model}</span> / {selectedRow.dataset} / {selectedRow.method}
                                    </h2>
                                    <button onClick={() => setSelectedRow(null)} className="text-gray-400 hover:text-gray-900 text-3xl leading-none font-bold p-2">&times;</button>
                                </div>
                                <div className="p-0 overflow-y-auto flex-1 bg-gray-900">
                                    <pre className="text-green-400 p-6 text-sm font-mono whitespace-pre-wrap">{JSON.stringify(selectedRow, null, 2)}</pre>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
