<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Comparison Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Chart.js Dependencies for Histograms -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans h-screen flex flex-col overflow-hidden">
    <div id="root" class="flex-1 flex flex-col overflow-hidden"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // SHA-256 of the password
        const PASSWORD_SHA256 = "737fcfd94d352730456aca4d15a4b3e69fccf5aa48fb33840b7f70b7105e01ce";
        const sha256Hex = async (text) => {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
        };

        // ---------------------------------------------------------
        // HISTOGRAM COMPONENT
        // Handles rendering dual datasets in Chart.js
        // ---------------------------------------------------------
        function HistogramChart({ histograms, title }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current || !histograms) return;

                const { answerable, unanswerable } = histograms;
                
                // Only render if at least one histogram has data
                if (!answerable && !unanswerable) return;

                // Cleanup previous chart instance if it exists
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                // 1. Get all unique buckets (keys) from BOTH histograms
                const allKeys = new Set([
                    ...(answerable ? Object.keys(answerable) : []),
                    ...(unanswerable ? Object.keys(unanswerable) : [])
                ]);

                // 2. Sort the buckets numerically for the X-axis
                const labels = Array.from(allKeys).sort((a, b) => Number(a) - Number(b));

                // 3. Map values to labels, defaulting to 0 if a bucket is missing
                const ansValues = labels.map(key => (answerable && answerable[key]) ? answerable[key] : 0);
                const unansValues = labels.map(key => (unanswerable && unanswerable[key]) ? unanswerable[key] : 0);

                // 4. Create the Chart
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Answerable Max Freq',
                                data: ansValues,
                                backgroundColor: 'rgba(16, 185, 129, 0.6)', // Emerald green
                                borderColor: 'rgb(5, 150, 105)',
                                borderWidth: 1,
                                borderRadius: 4
                            },
                            {
                                label: 'Unanswerable Max Freq',
                                data: unansValues,
                                backgroundColor: 'rgba(244, 63, 94, 0.6)', // Rose red
                                borderColor: 'rgb(225, 29, 72)',
                                borderWidth: 1,
                                borderRadius: 4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: true, position: 'top' }, // Turn legend ON to differentiate
                            title: { display: true, text: title, font: { size: 16 } }
                        },
                        scales: {
                            y: { beginAtZero: true, title: { display: true, text: 'Count' } },
                            x: { title: { display: true, text: 'Frequency Bucket' } }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [histograms, title]);

            return (
                <div className="w-full h-72 mt-4">
                    <canvas ref={chartRef}></canvas>
                </div>
            );
        }

        // ---------------------------------------------------------
        // MULTI-SELECT DROPDOWN
        // ---------------------------------------------------------
        function MultiSelect({ options, selected, onChange, allLabel }) {
            const [open, setOpen] = useState(false);
            const ref = useRef(null);
            useEffect(() => {
                const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
                document.addEventListener("mousedown", close);
                return () => document.removeEventListener("mousedown", close);
            }, []);
            const toggle = (o) => onChange(selected.includes(o) ? selected.filter(x => x !== o) : [...selected, o]);
            const label = selected.length === 0 ? allLabel
                : selected.length === 1 ? selected[0] : `${selected.length} selected`;
            return (
                <div className="relative" ref={ref}>
                    <button type="button" onClick={() => setOpen(!open)} title={selected.join(", ")}
                        className="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded p-2 text-left flex justify-between items-center">
                        <span className="truncate">{label}</span><span className="text-gray-500 ml-2">&#9662;</span>
                    </button>
                    {open && (
                        <div className="absolute z-40 mt-1 w-full max-h-72 overflow-auto bg-white border border-gray-300 rounded shadow-lg">
                            <div className="flex justify-between px-3 py-2 border-b border-gray-200 text-xs">
                                <button type="button" onClick={() => onChange([...options])} className="text-blue-700 hover:underline">Select all</button>
                                <button type="button" onClick={() => onChange([])} className="text-gray-600 hover:underline">Clear (show all)</button>
                            </div>
                            {options.map(o => (
                                <label key={o} className="flex items-center gap-2 px-3 py-1.5 text-sm hover:bg-gray-100 cursor-pointer">
                                    <input type="checkbox" checked={selected.includes(o)} onChange={() => toggle(o)} />
                                    <span>{o}</span>
                                </label>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        // ---------------------------------------------------------
        // MAIN APP DASHBOARD
        // ---------------------------------------------------------
        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [passwordInput, setPasswordInput] = useState("");
            const [loginError, setLoginError] = useState(false);

            const [data, setData] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            
            const [selectedRawRow, setSelectedRawRow] = useState(null);
            const [selectedHistogram, setSelectedHistogram] = useState(null);
            
            const [filterModel, setFilterModel] = useState("All");
            const [filterDataset, setFilterDataset] = useState("All");
            const [filterAwareness, setFilterAwareness] = useState("All");
            const [filterMethods, setFilterMethods] = useState([]);
            
            const [sortConfig, setSortConfig] = useState({ key: null, direction: 'asc' });

            useEffect(() => {
                if (!isAuthenticated) return;

                fetch('results.json', { cache: 'no-cache' })
                    .then(res => {
                        if (!res.ok) throw new Error("Could not load JSON file.");
                        return res.json();
                    })
                    .then(jsonData => {
                        const parsedRows = [];
                        
                        for (const [model, result] of Object.entries(jsonData)) {
                            for (const [dataset, aware_res] of Object.entries(result)) {
                                for (const [mode, methods] of Object.entries(aware_res)) {
                                    const mode_str = mode === "_abstaintion" ? "Aware" : "Unaware";
                                    
                                    if (!methods || Object.keys(methods).length === 0) continue;
                                    
                                    // Entries written by experiments_CRP.py before the 2026-10-30 fix keep their metrics one
                                    // level down ({method: {method: {...}}} or Oracle's {..._keepIDK, ..._dropIDK}): show those
                                    // children as rows. Ablation-grid cells and val_set stay in the raw JSON only.
                                    const entries = [];
                                    for (const [method, details] of Object.entries(methods)) {
                                        if (!details || Object.keys(details).length === 0) continue;
                                        // keep/drop-IDK ablations for validation (V_) and test (T_) stay in the raw JSON only;
                                        // the keep/keep variant is the method itself and is shown under its plain name
                                        if (method.includes('__V_') && !method.endsWith('__V_keepIDK__T_keepIDK')) continue;
                                        if (details.metrics) { entries.push([method, details]); continue; }
                                        for (const [sub, subDetails] of Object.entries(details)) {
                                            if (subDetails && subDetails.metrics && sub !== 'val_set' && sub !== 'ablation_grid' && !sub.includes('__V_'))
                                                entries.push([sub, subDetails]);
                                        }
                                    }

                                    for (const [method, details] of entries) {
                                        const metrics = details.metrics || {};
                                        const ans = metrics.answerable || {};
                                        const unans = metrics.unanswerable || {};
                                        const err_analysis = details.error_analysis || {};
                                        const fn_missed = err_analysis.FN_missed_answerable || {};
                                        const fp_hallucinated = err_analysis.FP_hallucinated_unanswerable || {};
                                        
                                        const ans_hist = err_analysis.answerable_max_freq_histogram || null;
                                        const unans_hist = err_analysis.unanswerable_max_freq_histogram || null;

                                        const row = {
                                            id: `${model}-${dataset}-${mode_str}-${method}`,
                                            Model: model.replace('result_', ''),
                                            Dataset: dataset,
                                            n_ans: details.ans_count,
                                            n_unans: details.unans_count,
                                            Awareness: mode_str,
                                            Method: method.replace(/^_/, '').replace('__V_keepIDK__T_keepIDK', ''),
                                            Overall_Acc: metrics.overall_accuracy,
                                            Overall_f1: metrics.overall_f1,
                                            Ans_accuracy: ans.accuracy,
                                            Unans_accuracy: unans.accuracy,
                                            ans_f1: ans.f1,
                                            unans_f1: unans.f1,
                                            ans_correct_in_samples: details.ans_correct_in_samples ?? ans.ans_correct_in_samples,
                                            unans_correct_in_samples: details.unans_correct_in_samples ?? unans.unans_correct_in_samples,
                                            FN_correct_present: fn_missed.correct_present_count,
                                            FN_most_freq: fn_missed.correct_was_most_freq_count, // <-- NEW FIELD
                                            FP_correct_present: fp_hallucinated.correct_present_count,
                                            Threshold: details.learned_threshold,
                                            ThresholdLabel: details.threshold_label,
                                            Histograms: { answerable: ans_hist, unanswerable: unans_hist },
                                            rawDetails: details
                                        };
                                        parsedRows.push(row);
                                    }
                                }
                            }
                        }
                        setData(parsedRows);
                        setLoading(false);
                    })
                    .catch(err => {
                        setError(err.message);
                        setLoading(false);
                    });
            }, [isAuthenticated]);

            const uniqueModels = useMemo(() => [...new Set(data.map(d => d.Model))], [data]);
            const uniqueDatasets = useMemo(() => [...new Set(data.map(d => d.Dataset))], [data]);
            const uniqueAwareness = useMemo(() => [...new Set(data.map(d => d.Awareness))], [data]);
            const uniqueMethods = useMemo(() => [...new Set(data.map(d => d.Method))], [data]);

            const filteredData = useMemo(() => {
                return data.filter(row => {
                    return (filterModel === "All" || row.Model === filterModel) &&
                           (filterDataset === "All" || row.Dataset === filterDataset) &&
                           (filterAwareness === "All" || row.Awareness === filterAwareness) &&
                           (filterMethods.length === 0 || filterMethods.includes(row.Method));
                });
            }, [data, filterModel, filterDataset, filterAwareness, filterMethods]);

            const sortedData = useMemo(() => {
                let sortableItems = [...filteredData];
                if (sortConfig.key !== null) {
                    sortableItems.sort((a, b) => {
                        const aVal = a[sortConfig.key] !== undefined && a[sortConfig.key] !== null ? a[sortConfig.key] : -Infinity;
                        const bVal = b[sortConfig.key] !== undefined && b[sortConfig.key] !== null ? b[sortConfig.key] : -Infinity;
                        
                        if (aVal < bVal) return sortConfig.direction === 'asc' ? -1 : 1;
                        if (aVal > bVal) return sortConfig.direction === 'asc' ? 1 : -1;
                        return 0;
                    });
                }
                return sortableItems;
            }, [filteredData, sortConfig]);

            const handleLogin = async (e) => {
                e.preventDefault();
                if (await sha256Hex(passwordInput) === PASSWORD_SHA256) {
                    setIsAuthenticated(true);
                } else {
                    setLoginError(true);
                    setPasswordInput("");
                }
            };

            const requestSort = (key) => {
                let direction = 'asc';
                if (sortConfig.key === key && sortConfig.direction === 'asc') direction = 'desc';
                setSortConfig({ key, direction });
            };

            const getSortIndicator = (key) => sortConfig.key === key ? (sortConfig.direction === 'asc' ? ' ▲' : ' ▼') : ' ↕';
            const formatDecimal = (num) => (num !== null && num !== undefined) ? Number(num).toFixed(2) : '-';
            const formatInt = (num) => (num !== null && num !== undefined) ? Number(num).toString() : '-';

            if (!isAuthenticated) {
                return (
                    <div className="flex-1 flex items-center justify-center bg-gray-100">
                        <div className="bg-white p-8 rounded-lg shadow-md w-full max-w-sm border border-gray-200">
                            <h2 className="text-2xl font-bold text-center mb-6 text-gray-800">Dashboard Access</h2>
                            <form onSubmit={handleLogin} className="flex flex-col gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
                                    <input 
                                        type="password" 
                                        value={passwordInput}
                                        onChange={(e) => { setPasswordInput(e.target.value); setLoginError(false); }}
                                        className="w-full px-4 py-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500"
                                        placeholder="Enter password"
                                        autoFocus
                                    />
                                </div>
                                {loginError && <p className="text-red-500 text-sm">Incorrect password.</p>}
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition">
                                    Login
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (loading) return <div className="flex-1 flex items-center justify-center text-xl text-blue-600 font-bold">Loading Model Data...</div>;
            if (error) return <div className="flex-1 flex items-center justify-center text-xl text-red-600 font-bold">Error: {error}</div>;

            return (
                <div className="mx-auto p-6 flex-1 w-full flex flex-col h-full">
                    <div className="flex justify-between items-end mb-4 shrink-0">
                        <div>
                            <h1 className="text-3xl font-bold mb-2">Model Comparison Dashboard</h1>
                            <p className="text-gray-500">Filtered deep-dive into model awareness, accuracy, and error states.</p>
                        </div>
                        <button onClick={() => setIsAuthenticated(false)} className="text-sm text-gray-500 hover:text-red-600 underline">Logout</button>
                    </div>
                    
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4 p-4 bg-white rounded-lg shadow border border-gray-200 shrink-0">
                        <div>
                            <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Model</label>
                            <select value={filterModel} onChange={(e) => setFilterModel(e.target.value)} className="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded p-2">
                                <option value="All">All Models</option>
                                {uniqueModels.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Dataset</label>
                            <select value={filterDataset} onChange={(e) => setFilterDataset(e.target.value)} className="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded p-2">
                                <option value="All">All Datasets</option>
                                {uniqueDatasets.map(d => <option key={d} value={d}>{d}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Awareness</label>
                            <select value={filterAwareness} onChange={(e) => setFilterAwareness(e.target.value)} className="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded p-2">
                                <option value="All">All Modes</option>
                                {uniqueAwareness.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Method</label>
                            <MultiSelect options={uniqueMethods} selected={filterMethods} onChange={setFilterMethods} allLabel="All Methods" />
                        </div>
                    </div>

                    <div className="bg-white shadow-md rounded-lg border border-gray-200 flex-1 overflow-hidden flex flex-col relative">
                        <div className="overflow-auto flex-1 relative">
                            <table className="min-w-full text-xs text-left whitespace-nowrap select-none">
                                <thead className="bg-gray-800 text-white uppercase tracking-wide sticky top-0 z-10">
                                    <tr>
                                        <th className="px-4 py-3 cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('Model')}>
                                            Model <span className="text-gray-400 text-[10px]">{getSortIndicator('Model')}</span>
                                        </th>
                                        <th className="px-4 py-3 border-l border-gray-700 cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('Dataset')}>
                                            Dataset <span className="text-gray-400 text-[10px]">{getSortIndicator('Dataset')}</span>
                                        </th>
                                        <th className="px-4 py-3 border-l border-gray-700 cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('n_ans')}>
                                            N Ans <span className="text-gray-400 text-[10px]">{getSortIndicator('n_ans')}</span>
                                        </th>
                                        <th className="px-4 py-3 border-l border-gray-700 cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('n_unans')}>
                                            N Unans <span className="text-gray-400 text-[10px]">{getSortIndicator('n_unans')}</span>
                                        </th>
                                        <th className="px-4 py-3 cursor-pointer hover:bg-gray-700 transition border-l border-gray-700" onClick={() => requestSort('Awareness')}>
                                            Aware <span className="text-gray-400 text-[10px]">{getSortIndicator('Awareness')}</span>
                                        </th>
                                        <th className="px-4 py-3 cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('Method')}>
                                            Method <span className="text-gray-400 text-[10px]">{getSortIndicator('Method')}</span>
                                        </th>
                                        <th className="px-4 py-3 text-right bg-blue-900 border-l border-gray-700 cursor-pointer hover:bg-blue-800 transition" onClick={() => requestSort('Overall_f1')}>
                                            Overall F1 <span className="text-gray-300 text-[10px]">{getSortIndicator('Overall_f1')}</span>
                                        </th>
                                        <th className="px-4 py-3 text-right border-l border-gray-700 cursor-pointer hover:bg-gray-700 transition text-purple-200" onClick={() => requestSort('ans_f1')}>
                                            Ans F1 <span className="text-gray-400 text-[10px]">{getSortIndicator('ans_f1')}</span>
                                        </th>
                                        <th className="px-4 py-3 text-right cursor-pointer hover:bg-gray-700 transition text-purple-200" onClick={() => requestSort('unans_f1')}>
                                            Unans F1 <span className="text-gray-400 text-[10px]">{getSortIndicator('unans_f1')}</span>
                                        </th>
                                        <th className="px-4 py-3 text-right bg-blue-900 border-l border-gray-700 cursor-pointer hover:bg-blue-800 transition" onClick={() => requestSort('Overall_Acc')}>
                                            Overall Acc <span className="text-gray-300 text-[10px]">{getSortIndicator('Overall_Acc')}</span>
                                        </th>
                                        <th className="px-4 py-3 text-right border-l border-gray-700 cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('Ans_accuracy')}>
                                            Ans Acc <span className="text-gray-400 text-[10px]">{getSortIndicator('Ans_accuracy')}</span>
                                        </th>
                                        <th className="px-4 py-3 text-right cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('Unans_accuracy')}>
                                            Unans Acc <span className="text-gray-400 text-[10px]">{getSortIndicator('Unans_accuracy')}</span>
                                        </th>
                                        <th className="px-4 py-3 text-right border-l border-gray-700 cursor-pointer hover:bg-gray-700 transition text-emerald-200" onClick={() => requestSort('ans_correct_in_samples')}>
                                            Ans Correct <span className="text-gray-400 text-[10px]">{getSortIndicator('ans_correct_in_samples')}</span>
                                        </th>
                                        <th className="px-4 py-3 text-right cursor-pointer hover:bg-gray-700 transition text-emerald-200" onClick={() => requestSort('unans_correct_in_samples')}>
                                            Unans Correct <span className="text-gray-400 text-[10px]">{getSortIndicator('unans_correct_in_samples')}</span>
                                        </th>
                                        <th className="px-4 py-3 text-right border-l border-gray-700 cursor-pointer hover:bg-gray-700 transition text-red-200" onClick={() => requestSort('FN_correct_present')}>
                                            FN Correct <span className="text-gray-400 text-[10px]">{getSortIndicator('FN_correct_present')}</span>
                                        </th>
                                        <th className="px-4 py-3 text-right cursor-pointer hover:bg-gray-700 transition text-red-200" onClick={() => requestSort('FN_most_freq')}>
                                            FN Most Freq <span className="text-gray-400 text-[10px]">{getSortIndicator('FN_most_freq')}</span>
                                        </th>
                                        <th className="px-4 py-3 text-right cursor-pointer hover:bg-gray-700 transition text-red-200" onClick={() => requestSort('FP_correct_present')}>
                                            FP Correct <span className="text-gray-400 text-[10px]">{getSortIndicator('FP_correct_present')}</span>
                                        </th>
                                        <th className="px-4 py-3 text-right border-l border-gray-700 cursor-pointer hover:bg-gray-700 transition" onClick={() => requestSort('Threshold')}>
                                            Threshold <span className="text-gray-400 text-[10px]">{getSortIndicator('Threshold')}</span>
                                        </th>
                                        <th className="px-4 py-3 text-center border-l border-gray-700">Histogram</th>
                                        <th className="px-4 py-3 text-center">JSON</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-200">
                                    {sortedData.map((row, index) => {
                                        const hasHistogram = row.Histograms && (
                                            (row.Histograms.answerable && Object.keys(row.Histograms.answerable).length > 0) ||
                                            (row.Histograms.unanswerable && Object.keys(row.Histograms.unanswerable).length > 0)
                                        );

                                        return (
                                            <tr key={row.id} className={`hover:bg-blue-50 transition-colors ${index % 2 === 0 ? "bg-white" : "bg-gray-50"}`}>
                                                <td className="px-4 py-3 font-bold text-blue-900">{row.Model}</td>
                                                <td className="px-4 py-3 font-semibold border-l border-gray-200">{row.Dataset}</td>
                                                <td className="px-4 py-3 border-l border-gray-200 text-indigo-700 font-mono">{formatInt(row.n_ans)}</td>
                                                <td className="px-4 py-3 text-indigo-700 font-mono">{formatInt(row.n_unans)}</td>
                                                <td className="px-4 py-3 border-l border-gray-200">
                                                    <span className={`px-2 py-1 rounded text-xs font-bold ${row.Awareness === 'Aware' ? 'bg-purple-100 text-purple-800' : 'bg-gray-200 text-gray-800'}`}>
                                                        {row.Awareness}
                                                    </span>
                                                </td>
                                                <td className="px-4 py-3 text-gray-600">{row.Method}</td>
                                                <td className="px-4 py-3 text-right font-bold text-gray-900 bg-blue-50 border-l border-blue-100">{formatDecimal(row.Overall_f1)}</td>
                                                <td className="px-4 py-3 text-right border-l border-gray-200 text-purple-800 font-mono">{formatDecimal(row.ans_f1)}</td>
                                                <td className="px-4 py-3 text-right text-purple-800 font-mono">{formatDecimal(row.unans_f1)}</td>
                                                <td className="px-4 py-3 text-right font-bold text-gray-900 bg-blue-50 border-l border-blue-100">{formatDecimal(row.Overall_Acc)}</td>
                                                <td className="px-4 py-3 text-right border-l border-gray-200 text-gray-700">{formatDecimal(row.Ans_accuracy)}</td>
                                                <td className="px-4 py-3 text-right text-gray-700">{formatDecimal(row.Unans_accuracy)}</td>
                                                <td className="px-4 py-3 text-right border-l border-gray-200 text-emerald-700 font-mono">{formatInt(row.ans_correct_in_samples)}</td>
                                                <td className="px-4 py-3 text-right text-emerald-700 font-mono">{formatInt(row.unans_correct_in_samples)}</td>
                                                <td className="px-4 py-3 text-right border-l border-gray-200 text-red-700 font-mono">{formatInt(row.FN_correct_present)}</td>
                                                <td className="px-4 py-3 text-right text-red-700 font-mono">{formatInt(row.FN_most_freq)}</td>
                                                <td className="px-4 py-3 text-right text-red-700 font-mono">{formatInt(row.FP_correct_present)}</td>
                                                <td className="px-4 py-3 text-right border-l border-gray-200 text-gray-500 font-mono">{row.ThresholdLabel ?? formatDecimal(row.Threshold)}</td>
                                                
                                                <td className="px-4 py-3 text-center border-l border-gray-200">
                                                    {hasHistogram ? (
                                                        <button onClick={() => setSelectedHistogram(row)} className="bg-blue-100 hover:bg-blue-200 text-blue-800 px-2 py-1 rounded text-[10px] font-bold transition shadow-sm border border-blue-300">
                                                            CHART
                                                        </button>
                                                    ) : (
                                                        <span className="text-gray-300 text-[10px]">N/A</span>
                                                    )}
                                                </td>

                                                <td className="px-4 py-3 text-center">
                                                    <button onClick={() => setSelectedRawRow(row)} className="bg-gray-800 hover:bg-black text-white px-2 py-1 rounded text-[10px] font-bold transition shadow-sm">
                                                        RAW
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                    {sortedData.length === 0 && <tr><td colSpan="20" className="px-4 py-8 text-center text-gray-500 font-medium">No data matches the selected filters.</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {selectedRawRow && (
                        <div className="fixed inset-0 bg-gray-900 bg-opacity-75 flex justify-center items-center p-4 z-50 backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col relative">
                                <div className="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                                    <h2 className="text-xl font-bold text-gray-800">
                                        <span className="text-blue-600">{selectedRawRow.Model}</span> / {selectedRawRow.Dataset} / {selectedRawRow.Method}
                                    </h2>
                                    <button onClick={() => setSelectedRawRow(null)} className="text-gray-400 hover:text-gray-900 text-3xl leading-none font-bold p-2">&times;</button>
                                </div>
                                <div className="p-0 overflow-y-auto flex-1 bg-gray-900">
                                    <pre className="text-green-400 p-6 text-sm font-mono whitespace-pre-wrap">{JSON.stringify(selectedRawRow.rawDetails, null, 2)}</pre>
                                </div>
                            </div>
                        </div>
                    )}

                    {selectedHistogram && (
                        <div className="fixed inset-0 bg-gray-900 bg-opacity-75 flex justify-center items-center p-4 z-50 backdrop-blur-sm">
                            <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col relative">
                                <div className="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                                    <h2 className="text-xl font-bold text-gray-800">
                                        Frequency Distributions
                                        <span className="block text-sm text-gray-500 font-normal">
                                            {selectedHistogram.Model} / {selectedHistogram.Dataset} / {selectedHistogram.Method}
                                        </span>
                                    </h2>
                                    <button onClick={() => setSelectedHistogram(null)} className="text-gray-400 hover:text-gray-900 text-3xl leading-none font-bold p-2">&times;</button>
                                </div>
                                <div className="p-6 bg-white">
                                    <HistogramChart 
                                        histograms={selectedHistogram.Histograms} 
                                        title={`Answerable vs. Unanswerable`} 
                                    />
                                </div>
                                <div className="p-4 border-t border-gray-200 bg-gray-50 text-xs font-mono text-gray-500 max-h-32 overflow-y-auto">
                                    <strong>Raw Data: </strong> {JSON.stringify(selectedHistogram.Histograms)}
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
